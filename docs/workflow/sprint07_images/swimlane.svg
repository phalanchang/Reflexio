<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 750" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Lanes -->
  <rect x="0" y="0" width="270" height="750" fill="#d5e8d4" stroke="#82b366" rx="4"/>
  <rect x="270" y="0" width="280" height="750" fill="#dae8fc" stroke="#6c8ebf" rx="4"/>
  <rect x="550" y="0" width="280" height="750" fill="#ffe6cc" stroke="#d6b656" rx="4"/>
  <rect x="830" y="0" width="270" height="750" fill="#e1d5e7" stroke="#9673a6" rx="4"/>
  <rect x="1100" y="0" width="280" height="750" fill="#fff2cc" stroke="#d6b656" rx="4"/>
  <text x="135" y="20" text-anchor="middle" font-weight="bold" font-size="14">ブラウザ</text>
  <text x="410" y="20" text-anchor="middle" font-weight="bold" font-size="14">React</text>
  <text x="690" y="20" text-anchor="middle" font-weight="bold" font-size="14">Express</text>
  <text x="965" y="20" text-anchor="middle" font-weight="bold" font-size="14">MySQL</text>
  <text x="1240" y="20" text-anchor="middle" font-weight="bold" font-size="14">ファイルシステム</text>

  <!-- アップロードフロー -->
  <rect x="20" y="50" width="230" height="35" rx="8" fill="#fff" stroke="#82b366" stroke-width="1.5"/>
  <text x="135" y="72" text-anchor="middle" font-size="12">Ctrl+V ペースト or ファイル選択</text>

  <rect x="290" y="50" width="240" height="40" rx="8" fill="#fff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="410" y="66" text-anchor="middle" font-size="11">WishForm.js ペーストハンドラ</text>
  <text x="410" y="82" text-anchor="middle" font-size="11">createObjectURL プレビュー</text>
  <line x1="250" y1="67" x2="290" y2="70" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="290" y="120" width="240" height="35" rx="8" fill="#fff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="410" y="142" text-anchor="middle" font-size="12">プレビュー表示 (サムネ+削除)</text>

  <rect x="290" y="190" width="240" height="40" rx="8" fill="#fff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="410" y="206" text-anchor="middle" font-size="11">wish保存後</text>
  <text x="410" y="222" text-anchor="middle" font-size="11">POST /wishes/:wishId/images</text>

  <rect x="570" y="190" width="240" height="45" rx="8" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="690" y="206" text-anchor="middle" font-size="11">multer ミドルウェア</text>
  <text x="690" y="222" text-anchor="middle" font-size="11">5MB上限, JPEG/PNG/GIF/WebP</text>
  <line x1="530" y1="210" x2="570" y2="210" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1120" y="270" width="240" height="35" rx="8" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="1240" y="292" text-anchor="middle" font-size="12">uploads/{user_id}/ 保存</text>
  <line x1="810" y1="235" x2="1120" y2="287" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="850" y="270" width="240" height="35" rx="8" fill="#fff" stroke="#9673a6" stroke-width="1.5"/>
  <text x="965" y="292" text-anchor="middle" font-size="12">wish_images INSERT</text>
  <line x1="690" y1="235" x2="850" y2="287" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 表示フロー -->
  <text x="135" y="350" text-anchor="middle" font-weight="bold" font-size="12" fill="#555">--- 画像表示 ---</text>

  <rect x="290" y="370" width="240" height="35" rx="8" fill="#fff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="410" y="392" text-anchor="middle" font-size="12">WishList.js サムネイル表示</text>

  <rect x="570" y="370" width="240" height="40" rx="8" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="690" y="386" text-anchor="middle" font-size="11">GET /wishes/images/:id</text>
  <text x="690" y="402" text-anchor="middle" font-size="11">認証+所有権チェック</text>
  <line x1="530" y1="387" x2="570" y2="390" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="1120" y="370" width="240" height="35" rx="8" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="1240" y="392" text-anchor="middle" font-size="12">ファイルストリーム配信</text>
  <line x1="810" y1="390" x2="1120" y2="387" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="20" y="450" width="230" height="35" rx="8" fill="#fff" stroke="#82b366" stroke-width="1.5"/>
  <text x="135" y="472" text-anchor="middle" font-size="12">サムネイルクリック</text>

  <rect x="290" y="450" width="240" height="40" rx="8" fill="#fff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="410" y="466" text-anchor="middle" font-size="11">ImageModal.js 全画面ビューア</text>
  <text x="410" y="482" text-anchor="middle" font-size="11">(ESC/オーバーレイで閉じ)</text>
  <line x1="250" y1="467" x2="290" y2="470" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 削除フロー -->
  <text x="135" y="530" text-anchor="middle" font-weight="bold" font-size="12" fill="#555">--- 画像削除 ---</text>

  <rect x="570" y="550" width="240" height="35" rx="8" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="690" y="572" text-anchor="middle" font-size="12">DELETE /wishes/images/:id</text>

  <rect x="1120" y="550" width="240" height="35" rx="8" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="1240" y="572" text-anchor="middle" font-size="12">ファイル削除</text>
  <line x1="810" y1="567" x2="1120" y2="567" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="850" y="550" width="240" height="40" rx="8" fill="#fff" stroke="#9673a6" stroke-width="1.5"/>
  <text x="965" y="566" text-anchor="middle" font-size="11">wish_images DELETE</text>
  <text x="965" y="582" text-anchor="middle" font-size="11">(wish削除時CASCADE)</text>
  <line x1="690" y1="585" x2="850" y2="570" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
