<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="sans-serif" font-size="13">
  <!-- Lanes -->
  <rect x="0" y="0" width="300" height="700" fill="#d5e8d4" stroke="#82b366" rx="4"/>
  <rect x="300" y="0" width="300" height="700" fill="#dae8fc" stroke="#6c8ebf" rx="4"/>
  <rect x="600" y="0" width="300" height="700" fill="#ffe6cc" stroke="#d6b656" rx="4"/>
  <rect x="900" y="0" width="300" height="700" fill="#e1d5e7" stroke="#9673a6" rx="4"/>
  <text x="150" y="20" text-anchor="middle" font-weight="bold" font-size="14">ブラウザ (User)</text>
  <text x="450" y="20" text-anchor="middle" font-weight="bold" font-size="14">React (Frontend)</text>
  <text x="750" y="20" text-anchor="middle" font-weight="bold" font-size="14">Express (Backend)</text>
  <text x="1050" y="20" text-anchor="middle" font-weight="bold" font-size="14">MySQL (DB)</text>

  <!-- OAuth設定登録フロー -->
  <rect x="30" y="50" width="240" height="35" rx="8" fill="#fff" stroke="#82b366" stroke-width="1.5"/>
  <text x="150" y="72" text-anchor="middle" font-size="12">設定画面に遷移</text>

  <rect x="330" y="50" width="240" height="35" rx="8" fill="#fff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="450" y="72" text-anchor="middle" font-size="12">Settings.js OAuth設定セクション</text>

  <line x1="270" y1="67" x2="330" y2="67" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="630" y="110" width="240" height="35" rx="8" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="750" y="132" text-anchor="middle" font-size="12">GET /api/google/settings</text>

  <line x1="570" y1="85" x2="630" y2="127" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="930" y="110" width="240" height="35" rx="8" fill="#fff" stroke="#9673a6" stroke-width="1.5"/>
  <text x="1050" y="132" text-anchor="middle" font-size="12">google_oauth_settings SELECT</text>

  <line x1="870" y1="127" x2="930" y2="127" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="630" y="170" width="240" height="35" rx="8" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="750" y="192" text-anchor="middle" font-size="12">secretマスク処理 (先頭6文字+****)</text>

  <line x1="1050" y1="145" x2="750" y2="170" stroke="#999" stroke-width="1" stroke-dasharray="4"/>

  <rect x="330" y="170" width="240" height="35" rx="8" fill="#fff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="450" y="192" text-anchor="middle" font-size="12">設定表示 (ID + マスク済Secret)</text>

  <line x1="630" y1="187" x2="570" y2="187" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 保存フロー -->
  <rect x="30" y="250" width="240" height="35" rx="8" fill="#fff" stroke="#82b366" stroke-width="1.5"/>
  <text x="150" y="272" text-anchor="middle" font-size="12">Client ID/Secret入力 →「保存」</text>

  <rect x="330" y="310" width="240" height="35" rx="8" fill="#fff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="450" y="332" text-anchor="middle" font-size="12">POST or PUT /api/google/settings</text>

  <line x1="270" y1="267" x2="330" y2="327" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="630" y="310" width="240" height="35" rx="8" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="750" y="332" text-anchor="middle" font-size="12">バリデーション + INSERT/UPDATE</text>

  <line x1="570" y1="327" x2="630" y2="327" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="930" y="310" width="240" height="35" rx="8" fill="#fff" stroke="#9673a6" stroke-width="1.5"/>
  <text x="1050" y="332" text-anchor="middle" font-size="12">UPSERT (UNIQUE user_id)</text>

  <line x1="870" y1="327" x2="930" y2="327" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="330" y="380" width="240" height="35" rx="8" fill="#fff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="450" y="402" text-anchor="middle" font-size="12">保存成功トースト表示</text>

  <line x1="930" y1="345" x2="570" y2="397" stroke="#999" stroke-width="1" stroke-dasharray="4"/>

  <!-- 接続フロー -->
  <rect x="330" y="470" width="240" height="45" rx="8" fill="#fff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="450" y="488" text-anchor="middle" font-size="12">GoogleConnect.js</text>
  <text x="450" y="504" text-anchor="middle" font-size="11">設定未登録→案内 / 登録済→接続ボタン</text>

  <rect x="630" y="470" width="240" height="45" rx="8" fill="#fff" stroke="#d6b656" stroke-width="1.5"/>
  <text x="750" y="488" text-anchor="middle" font-size="12">createOAuth2Client</text>
  <text x="750" y="504" text-anchor="middle" font-size="11">ユーザー設定優先→環境変数FB</text>

  <line x1="570" y1="492" x2="630" y2="492" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="330" y="550" width="240" height="35" rx="8" fill="#fff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="450" y="572" text-anchor="middle" font-size="12">Dashboard.js 3状態分岐表示</text>

  <line x1="750" y1="515" x2="450" y2="550" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>
